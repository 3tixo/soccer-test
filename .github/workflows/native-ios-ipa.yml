name: Build Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "native-ios/**"
      - ".github/workflows/native-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-native-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Build unsigned native iOS app
        working-directory: native-ios
        run: |
          xcodebuild \
            -project PitchPulseNative.xcodeproj \
            -scheme PitchPulseNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned native IPA
        working-directory: native-ios
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/PitchPulseNative.app
          zip -qry PitchPulseNative-unsigned.ipa Payload

      - name: Upload native IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchPulseNative-unsigned-ipa
          path: native-ios/PitchPulseNative-unsigned.ipa
