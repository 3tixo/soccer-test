name: PitchPulseNative
options:
  bundleIdPrefix: com.tixo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
targets:
  PitchPulseNative:
    type: application
    platform: iOS
    sources:
      - PitchPulseNative
      - PitchPulseShared
    dependencies:
      - target: PitchPulseNativeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tixo.pitchpulsenative
        PRODUCT_NAME: PitchPulseNative
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  PitchPulseNativeWidget:
    type: app-extension
    platform: iOS
    sources:
      - PitchPulseNativeWidget
      - PitchPulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tixo.pitchpulsenative.widget
        PRODUCT_NAME: PitchPulseNativeWidget
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PitchPulseNativeWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_PACKAGE_TYPE: "XPC!"
